<title>실내 장착 미리보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 레이아웃: 차량 선택 → 전체 화면 3D(외관/내관) + 하단 상품 드로어, 단일 다크 테마 뷰어 */
  :root {
    --bg: #101317;
    --panel: #181d23;
    --panel-2: #222932;
    --line: #2d3540;
    --fg: #e9edf3;
    --fg-dim: #9aa6b3;
    --accent: #6fb6c9;
    --accent-ink: #0b1316;
    --pop: #d9a05b;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px;
  }
  #app { position: relative; height: 100%; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage canvas { display: block; touch-action: none; }

  .chip {
    background: rgba(16,19,23,.85); border: 1px solid var(--line); color: var(--fg);
    border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font: inherit;
    backdrop-filter: blur(4px); cursor: pointer; white-space: nowrap;
  }
  button.chip:active { background: var(--line); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #topbar {
    position: absolute; top: 10px; left: 0; right: 0; z-index: 5;
    display: flex; gap: 6px; align-items: center; overflow-x: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    scrollbar-width: none;
  }
  #topbar::-webkit-scrollbar { display: none; }
  #modeSeg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: 0 0 auto; }
  #modeSeg button {
    border: none; background: rgba(16,19,23,.85); color: var(--fg-dim); font: inherit;
    font-size: 12.5px; padding: 7px 14px; cursor: pointer;
  }
  #modeSeg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .chipSet { display: flex; gap: 6px; }

  #fps {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 8px; z-index: 4;
    font-size: 10px; color: var(--fg-dim); font-variant-numeric: tabular-nums;
    background: rgba(16,19,23,.6); padding: 2px 6px; border-radius: 6px; pointer-events: none;
  }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); top: 56px; z-index: 5;
    pointer-events: none; background: rgba(111,182,201,.15); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 10px; padding: 7px 14px; font-size: 12.5px;
    max-width: 86%; text-align: center;
  }
  #fab {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
    display: flex; flex-direction: column; gap: 8px; bottom: 16px;
  }
  #fab button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(16,19,23,.88); color: var(--fg); font-size: 17px; cursor: pointer;
    backdrop-filter: blur(4px); position: relative;
  }
  #fab button:active { background: var(--line); }
  #cartCount {
    position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
    background: var(--accent); color: var(--accent-ink); border-radius: 9px;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; padding: 0 3px;
  }

  /* ---- 하단 드로어 ---- */
  #drawer {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #drawerHead { display: flex; align-items: center; gap: 8px; padding-block: 10px 2px; }
  #drawerTitle { font-size: 12.5px; color: var(--fg-dim); }
  #drawerMeta { margin-left: auto; font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #cats { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
  #cats::-webkit-scrollbar { display: none; }
  #cats .chip { background: var(--panel-2); backdrop-filter: none; }
  #cats .chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  #cards { display: flex; gap: 10px; overflow-x: auto; padding-block: 4px 14px; scrollbar-width: none; }
  #cards::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; width: 108px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; cursor: pointer; font: inherit; color: var(--fg);
    text-align: left; position: relative;
  }
  .card:active { border-color: var(--fg-dim); }
  .card.installed { border-color: var(--accent); }
  .card img { width: 92px; height: 92px; border-radius: 8px; background: #11151a; display: block; }
  .card .nm { font-size: 12px; line-height: 1.35; margin-top: 6px; min-height: 2.7em; }
  .card .pr { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  .card .badge {
    position: absolute; top: 6px; left: 6px; background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
  }
  .pop-tag {
    display: inline-block; background: rgba(217,160,91,.18); color: var(--pop);
    border-radius: 5px; font-size: 10px; font-weight: 700; padding: 1px 5px; margin-right: 4px;
    vertical-align: 1px;
  }
  #disclaim { font-size: 10.5px; color: var(--fg-dim); padding-bottom: 8px; margin: 0; }

  /* ---- 옵션 시트 ---- */
  #optSheet { padding-block: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  #optHead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #optName { font-size: 14px; font-weight: 700; }
  #optPrice { font-size: 12.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #optFit { font-size: 11px; color: var(--fg-dim); }
  #optSw { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: none; color: var(--fg-dim); font: inherit; font-size: 11px; cursor: pointer;
    padding: 0;
  }
  .sw .dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
  .sw.on { color: var(--fg); }
  .sw.on .dot { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(111,182,201,.35); }
  #optActions { display: flex; gap: 8px; }
  #optActions button {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--fg); font: inherit; font-size: 13.5px; padding: 11px; cursor: pointer;
  }
  #optActions .done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  /* ---- 모달 공통 ---- */
  .modal {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .sheet {
    width: 100%; max-width: 520px; box-sizing: border-box; background: var(--panel);
    border-radius: 16px 16px 0 0; border: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 10px; max-height: 70%;
  }
  .sheet h2 { font-size: 14px; margin: 0; }
  #cartRows { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .cartRow { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 9px 11px; }
  .cartRow .ri { min-width: 0; }
  .cartRow .rn { font-size: 13px; }
  .cartRow .rv { font-size: 11.5px; color: var(--fg-dim); }
  .cartRow .rp { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cartRow .rx { background: none; border: none; color: var(--fg-dim); font-size: 15px; cursor: pointer; padding: 4px; }
  #cartTotal { display: flex; font-size: 13.5px; font-weight: 700; padding-inline: 2px; }
  #cartTotal span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; }
  .btnRow { display: flex; gap: 8px; }
  .btnRow button {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--fg); font: inherit; font-size: 13px; padding: 11px; cursor: pointer;
  }
  .btnRow .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #shotModal { justify-content: center; gap: 10px; padding: max(16px, env(safe-area-inset-left, 0px)); }
  #shotModal img { max-width: 92%; max-height: 68%; border-radius: 10px; border: 1px solid var(--line); }
  #shotModal p { color: var(--fg-dim); font-size: 12px; margin: 0; }
  .empty { color: var(--fg-dim); font-size: 13px; text-align: center; padding-block: 18px; }

  /* ---- 차량 선택 ---- */
  #carSelect {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #carSelect h1 { font-size: 19px; margin: 0; }
  #carSelect .sub { color: var(--fg-dim); font-size: 13px; margin: -8px 0 0; }
  #carList { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
  .carCard {
    width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; cursor: pointer; font: inherit; color: var(--fg); text-align: left;
  }
  .carCard:active { border-color: var(--accent); }
  .carCard img { width: 130px; height: 86px; object-fit: cover; border-radius: 9px; background: #11151a; display: block; }
  .carCard .cn { font-size: 13.5px; font-weight: 700; margin-top: 8px; }
  .carCard .cy { font-size: 11.5px; color: var(--fg-dim); }
  #carNote { font-size: 10.5px; color: var(--fg-dim); max-width: 480px; text-align: center; line-height: 1.6; margin: 0; }
</style>

<div id="app">
  <div id="stage">
    <div id="topbar">
      <button class="chip" id="carChange">차량 변경</button>
      <div id="modeSeg">
        <button id="modeExt" class="on">외관</button>
        <button id="modeInt">내관</button>
      </div>
      <span class="chipSet" id="extChips">
        <button class="chip on" data-eview="overview">전체</button>
        <button class="chip" data-eview="front">전면</button>
        <button class="chip" data-eview="rear">후면</button>
        <button class="chip" data-eview="side">측면</button>
        <button class="chip" id="paintBtn">차량 색상</button>
      </span>
      <span class="chipSet" id="intChips" hidden>
        <button class="chip on" data-iview="overview">전체</button>

        <button class="chip" data-iview="passenger">조수석</button>
        <button class="chip" data-iview="rear">2열</button>

      </span>
    </div>
    <div id="hint" hidden></div>
    <div id="fab">
      <button id="shotBtn" title="스크린샷" aria-label="스크린샷">📷</button>
      <button id="cartBtn" title="장착 목록" aria-label="장착 목록">🛒<span id="cartCount" hidden>0</span></button>
    </div>
    <div id="fps">-- fps</div>
  </div>

  <div id="drawer">
    <div id="main">
      <div id="drawerHead">
        <span id="drawerTitle"></span>

      <div id="cats"></div>
      <div id="cards"></div>
      <p id="disclaim">상품·가격은 POC용 예시 데이터이며, 호환 표시는 데모입니다.</p>

    <div id="optSheet" hidden>
      <div id="optHead">
        <span id="optName"></span>
        <span id="optPrice"></span>

      <div id="optSw"></div>
      <div id="optActions">
        <button id="optRemove">제거</button>

  <div id="cartModal" class="modal" hidden>
    <div class="sheet">
      <h2 id="cartTitle">장착한 상품</h2>

      <div id="cartTotal"><span>합계 (예시)</span><span id="cartSum">₩0</span></div>
      <div class="btnRow">
        <button id="copyList">목록 복사</button>
        <button id="clearAll">전체 비우기</button>

      </div>

  <div id="shotModal" class="modal" hidden>
    <img id="shotImg" alt="장면 스크린샷">

    <button class="chip" id="shotClose">닫기</button>

  <div id="carSelect" hidden>
    <h1>어떤 차를 꾸밀까요?</h1>
    <p class="sub">차종을 선택하면 호환 상품만 보여드립니다</p>
    <div id="carList"></div>
    <p id="carNote">차량명은 호환 대상 표기이며 제조사와 무관한 독립 시뮬레이터입니다.<br>차량 형상은 근사 모델(플레이스홀더)입니다.</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
const won = (n) => '₩' + n.toLocaleString('ko-KR');

/* ---------- 렌더러 / 장면 ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181e);
scene.fog = new THREE.Fog(0x14181e, 9, 22);

const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 80);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.12;
orbit.maxPolarAngle = Math.PI * 0.55;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xe8eef5, 0x3b4048, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e4, 2.2);
sun.position.set(3.2, 5.5, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 56).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x0e1115, roughness: 0.95 })
);
ground.position.y = -0.051;
ground.receiveShadow = true;
scene.add(ground);

const exteriorGroup = new THREE.Group();
const interiorGroup = new THREE.Group();
const productsGroup = new THREE.Group();
scene.add(exteriorGroup, interiorGroup, productsGroup);

function disposeGroup(g) {
  g.traverse((o) => { o.geometry?.dispose?.(); });
  g.clear();
}

/* ---------- 절차적 텍스처 / 재질 ---------- */
function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const carbonTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#101013'; g.fillRect(0, 0, s, s);
  const n = 8, k = s / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const gr = g.createLinearGradient(x * k, y * k, (x + 1) * k, (y + 1) * k);
    if ((x + y) % 2 === 0) { gr.addColorStop(0, '#2d2d33'); gr.addColorStop(1, '#0b0b0d'); }
    else { gr.addColorStop(0, '#141417'); gr.addColorStop(1, '#36363e'); }
    g.fillStyle = gr; g.fillRect(x * k, y * k, k - 1, k - 1);
  }
}, 5);
const woodTex = canvasTex(256, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s);
  gr.addColorStop(0, '#7a5635'); gr.addColorStop(0.5, '#6a4a2c'); gr.addColorStop(1, '#7f5b38');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    const y = Math.random() * s;
    g.strokeStyle = `rgba(40,24,12,${0.08 + Math.random() * 0.2})`;
    g.lineWidth = 0.5 + Math.random() * 1.5;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= s; x += 16) g.lineTo(x, y + Math.sin(x * 0.05 + i) * 2.5);
    g.stroke();
  }
}, 1);
function ribTexOf(base, rib) {
  return canvasTex(64, (g, s) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    g.fillStyle = rib;
    for (let y = 0; y < s; y += 8) g.fillRect(0, y, s, 3);
  }, 9);
}
const ribBlack = ribTexOf('#17181b', '#24262b');
const ribBeige = ribTexOf('#8d7f6a', '#9f9179');

const MAT = {
  carbon: () => new THREE.MeshPhysicalMaterial({ map: carbonTex, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.12 }),
  wood: () => new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.45 }),
  white: () => new THREE.MeshPhysicalMaterial({ color: 0xf2f2ee, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.08 }),
  black: () => new THREE.MeshStandardMaterial({ color: 0x1c1d21, roughness: 0.85 }),
  red: () => new THREE.MeshPhysicalMaterial({ color: 0x8e1626, roughness: 0.3, clearcoat: 1 }),
  silver: () => new THREE.MeshStandardMaterial({ color: 0xaeb3b9, roughness: 0.35, metalness: 0.7 }),
};
function glowMat(hex) {
  return new THREE.MeshStandardMaterial({ color: 0x070707, emissive: hex, emissiveIntensity: 3.2 });
}

/* ---------- 차량 정의 ---------- */
const PAINTS = [
  { id: '#3b3d42', label: '스텔스 그레이' },
  { id: '#e8e9ea', label: '펄 화이트' },
  { id: '#101114', label: '솔리드 블랙' },
  { id: '#8e1626', label: '울트라 레드' },
  { id: '#1f3a5f', label: '딥 블루' },
  { id: '#a8abb0', label: '퀵실버' },
];
const CARS = [
  { id: 'juniper', label: '모델 Y 주니퍼', sub: '2025~ · SUV', type: 'suv', width: 1.84, rearDisplay: true, defPaint: '#3b3d42' },
  { id: 'legacyY', label: '모델 Y 레거시', sub: '2020~2024 · SUV', type: 'suv', width: 1.84, rearDisplay: false, defPaint: '#e8e9ea' },
  { id: 'highland', label: '모델 3 하이랜드', sub: '2024~ · 세단', type: 'sedan', width: 1.78, rearDisplay: true, defPaint: '#8e1626' },
];
const carById = Object.fromEntries(CARS.map((c) => [c.id, c]));
const FIT_LABEL = { juniper: '모델 Y 주니퍼', legacyY: '모델 Y 레거시', highland: '모델 3 하이랜드' };

/* ---------- 외관 (절차 생성 차체) ---------- */
let paintMat = null;       // 현재 차 도장 재질
let wheelCapMats = [];     // 기본 휠 캡 (제품으로 덮어씀)

function bodyShape(type) {
  const s = new THREE.Shape();
  /* 차체는 벨트라인까지. 그 위는 글라스 캐노피가 덮는다 (베벨 확장으로 글라스가 묻히지 않게) */
  if (type === 'suv') {
    s.moveTo(-2.2, 0.36);
    s.quadraticCurveTo(-2.26, 0.62, -2.05, 0.72);
    s.quadraticCurveTo(-1.45, 0.9, -0.85, 0.96);
    s.quadraticCurveTo(0.6, 1.04, 2.05, 1.02);
    s.quadraticCurveTo(2.42, 1.0, 2.46, 0.94);
    s.quadraticCurveTo(2.56, 0.74, 2.5, 0.52);
    s.lineTo(2.5, 0.36);
  } else {
    s.moveTo(-2.2, 0.34);
    s.quadraticCurveTo(-2.26, 0.58, -2.02, 0.66);
    s.quadraticCurveTo(-1.35, 0.8, -0.8, 0.86);
    s.quadraticCurveTo(0.5, 0.94, 1.85, 0.92);
    s.lineTo(2.32, 0.9);
    s.quadraticCurveTo(2.46, 0.86, 2.46, 0.7);
    s.lineTo(2.46, 0.34);
  }
  const yb = type === 'suv' ? 0.36 : 0.34;
  s.lineTo(2.06, yb);
  s.absarc(1.6, yb, 0.46, 0, Math.PI, false);
  s.lineTo(-0.84, yb);
  s.absarc(-1.3, yb, 0.46, 0, Math.PI, false);
  s.lineTo(-2.2, yb);
  return s;
}
function glassShape(type) {

    s.moveTo(-0.85, 0.97);

    s.quadraticCurveTo(0.78, 1.45, 1.22, 1.32);

}
function extrudeCentered(shape, depth, bevel) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, steps: 1,
  });
  g.translate(0, 0, -depth / 2);
  g.rotateY(-Math.PI / 2); // shape.x(차 길이) → world z (전방 −z 유지)
  return g;
}
function buildExterior(car, paintHex) {

    cap.position.copy(w.position);

  // 라이트 (전면 슬림 2 + 후면 라이트바)

    m.position.set(x * (car.width / 2 - 0.12), 1.04, -0.5);

function persist() {

    theme, paint,
    items: [...installed.entries()].map(([id, e]) => ({ id, v: e.variant })),

function install(p, variantId, fly = true) {
  removeItem(p.id, false);
  const root = p.build(variantId, car);
  root.userData = { productId: p.id };
  root.visible = p.mode === mode || p.mode === 'int'; // 실내 상품은 외관에서도 유리 너머로 보임
  if (p.mode === 'ext' && mode === 'int') root.visible = false;
  productsGroup.add(root);
  installed.set(p.id, { root, variant: variantId });
  refreshCards(); refreshCartBadge(); persist();
  if (fly) flyTo(p.focus);
}
function removeItem(id, refresh = true) {
  const e = installed.get(id);
  if (!e) return;
  productsGroup.remove(e.root);
  installed.delete(id);
  if (refresh) { refreshCards(); refreshCartBadge(); persist(); }
}
function totalPrice() {
  let t = 0;

const thumbs = {};

function makeThumbs() {
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.toneMapping = THREE.ACESFilmicToneMapping;
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x11151a);
  sc.environment = scene.environment;
  sc.add(new THREE.HemisphereLight(0xffffff, 0x445, 1.2));
  const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 2); sc.add(d);
  const shoot = (obj, cam, w, h) => {
    r.setSize(w, h);
    sc.add(obj); r.render(sc, cam); sc.remove(obj);
    return r.domElement.toDataURL('image/png');
  };
  const cam = new THREE.PerspectiveCamera(40, 1, 0.01, 30);
  const thumbCar = CARS[0];
  for (const p of PRODUCTS) {
    const obj = p.thumbBuild ? p.thumbBuild() : p.build(p.def, thumbCar);
    const box = new THREE.Box3().setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length() || 0.3;
    obj.position.sub(c);
    cam.position.set(size * 0.8, size * 0.7, size * 1.1);
    cam.lookAt(0, 0, 0);
    cam.aspect = 1; cam.updateProjectionMatrix();
    thumbs[p.id] = shoot(obj, cam, 128, 128);
  }
  const carCam = new THREE.PerspectiveCamera(35, 150 / 86, 0.01, 40);
  for (const c of CARS) {
    const obj = buildExterior(c, c.defPaint);
    obj.position.y += 0.02;
    carCam.position.set(4.6, 2.0, -4.8);
    carCam.lookAt(0, 0.55, 0);
    carCam.updateProjectionMatrix();
    carThumbs[c.id] = shoot(obj, carCam, 300, 172);
    disposeGroup(obj);
  }
  r.dispose();
}

function selectCar(id) {
  car = carById[id];
  const saved = store.cars[id] || {};
  theme = saved.theme || 'black';
  paint = saved.paint || car.defPaint;

  // 장면 재구성
  for (const pid of [...installed.keys()]) removeItem(pid, false);
  disposeGroup(exteriorGroup);
  disposeGroup(interiorGroup);
  exteriorGroup.add(buildExterior(car, paint));
  interiorGroup.add(buildInterior(car));
  applyTheme(theme);
  $('themeBtn').textContent = '내장: ' + (theme === 'black' ? '블랙' : '화이트');

  for (const it of saved.items || []) {

    if (p && p.fit.includes(car.id)) {
      install(p, p.variants.some((v) => v.id === it.v) ? it.v : p.def, false);

  setMode('ext', false);
  camera.position.set(...EXT_VIEWS.overview.pos);
  orbit.target.set(...EXT_VIEWS.overview.tgt);

}

/* ---------- 3D 탭 → 상품 옵션 ---------- */
const raycaster = new THREE.Raycaster();
let downPos = null, downTime = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const dt = performance.now() - downTime;
  downPos = null;
  if (moved > 8 || dt > 600) return;
  const rect = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  ), camera);
  const hits = raycaster.intersectObjects(productsGroup.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData?.productId) o = o.parent;
    if (o && o.visible) {
      const p = byId[o.userData.productId];
      flyTo(p.focus); openOptions(p);
      return;
    }
  }
});

$('cartBtn').addEventListener('click', () => { refreshCart(); $('cartModal').hidden = false; });
$('cartClose').addEventListener('click', () => { $('cartModal').hidden = true; });
$('clearAll').addEventListener('click', () => {
  for (const id of [...installed.keys()]) removeItem(id, false);
  refreshCards(); refreshCartBadge(); refreshCart(); persist();
});
$('copyList').addEventListener('click', async () => {
  const lines = [`[${car.label}] 장착 조합`];
  for (const [id, e] of installed) {
    const p = byId[id];
    const v = p.variants.find((x) => x.id === e.variant)?.label ?? '';
    lines.push(`· ${p.name}${v ? ` (${v})` : ''} — ${won(p.price)}`);
  }
  lines.push(`합계 (예시): ${won(totalPrice())}`);
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); showHint('조합 목록을 복사했습니다', 2000); }
  catch { showHint('복사할 수 없는 환경입니다', 2500); }
});
function refreshCart() {
  $('cartTitle').textContent = car ? `장착한 상품 — ${car.label}` : '장착한 상품';
  const el = $('cartRows');
  el.textContent = '';
  if (!installed.size) {
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = '아직 장착한 상품이 없습니다';
    el.appendChild(d);
  }
  for (const [id, e] of installed) {
    const p = byId[id];
    const row = document.createElement('div'); row.className = 'cartRow';
    const img = document.createElement('img');
    img.src = thumbs[id]; img.alt = ''; img.style.cssText = 'width:40px;height:40px;border-radius:8px';
    const ri = document.createElement('div'); ri.className = 'ri';
    const rn = document.createElement('div'); rn.className = 'rn'; rn.textContent = p.name;
    const rv = document.createElement('div'); rv.className = 'rv';
    rv.textContent = p.variants.find((v) => v.id === e.variant)?.label ?? '';
    ri.append(rn, rv);
    const rp = document.createElement('div'); rp.className = 'rp'; rp.textContent = won(p.price);
    const rx = document.createElement('button'); rx.className = 'rx'; rx.textContent = '✕';
    rx.setAttribute('aria-label', p.name + ' 제거');
    rx.addEventListener('click', () => { removeItem(id); refreshCart(); });
    row.append(img, ri, rp, rx);
    el.appendChild(row);
  }
  $('cartSum').textContent = won(totalPrice());
}

/* ---------- 스크린샷 ---------- */
$('shotBtn').addEventListener('click', () => {
  renderer.render(scene, camera);
  $('shotImg').src = renderer.domElement.toDataURL('image/png');
  $('shotModal').hidden = false;
});
$('shotClose').addEventListener('click', () => { $('shotModal').hidden = true; });

/* ---------- 힌트 ---------- */
let hintTimer = 0;
function showHint(text, ms) {
  const h = $('hint');
  h.textContent = text; h.hidden = false;
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(() => { h.hidden = true; }, ms);
}

/* ---------- 시작 ---------- */
if (store.carId && carById[store.carId]) {
  selectCar(store.carId);
} else {
  $('carSelect').hidden = false;
}

/* ---------- 루프 / 리사이즈 / FPS ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let frames = 0, fpsT = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (flyAnim) {
    flyAnim.t = Math.min(1, flyAnim.t + 1 / 40);
    const k = 1 - Math.pow(1 - flyAnim.t, 3);
    camera.position.lerpVectors(flyAnim.p0, flyAnim.p1, k);
    orbit.target.lerpVectors(flyAnim.t0, flyAnim.t1, k);
    if (flyAnim.t >= 1) flyAnim = null;
  }
  orbit.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - fpsT >= 1000) {
    $('fps').textContent = Math.round(frames * 1000 / (now - fpsT)) + ' fps';
    frames = 0; fpsT = now;
  }
}
loop();
</script>
