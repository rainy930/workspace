<title>실내 장착 미리보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 레이아웃: 전체 화면 3D + 하단 상품 드로어(오늘의집 방꾸미기 스타일), 단일 다크 테마 뷰어 */
  :root {
    --bg: #101317;
    --panel: #181d23;
    --panel-2: #222932;
    --line: #2d3540;
    --fg: #e9edf3;
    --fg-dim: #9aa6b3;
    --accent: #6fb6c9;
    --accent-ink: #0b1316;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px;
  }
  #app { position: relative; height: 100%; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage canvas { display: block; touch-action: none; }

  .chip {
    background: rgba(16,19,23,.85); border: 1px solid var(--line); color: var(--fg);
    border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font: inherit;
    backdrop-filter: blur(4px); cursor: pointer; white-space: nowrap;
  }
  button.chip:active { background: var(--line); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #topbar {
    position: absolute; top: 10px; left: 0; right: 0; z-index: 5;
    display: flex; gap: 6px; align-items: center; overflow-x: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    scrollbar-width: none;
  }
  #topbar::-webkit-scrollbar { display: none; }
  #fps {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 8px; z-index: 4;
    font-size: 10px; color: var(--fg-dim); font-variant-numeric: tabular-nums;
    background: rgba(16,19,23,.6); padding: 2px 6px; border-radius: 6px; pointer-events: none;
  }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); top: 56px; z-index: 5;
    pointer-events: none; background: rgba(111,182,201,.15); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 10px; padding: 7px 14px; font-size: 12.5px;
    max-width: 86%; text-align: center;
  }
  #fab {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
    display: flex; flex-direction: column; gap: 8px; bottom: 16px;
  }
  #fab button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(16,19,23,.88); color: var(--fg); font-size: 17px; cursor: pointer;
    backdrop-filter: blur(4px); position: relative;
  }
  #fab button:active { background: var(--line); }
  #cartCount {
    position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
    background: var(--accent); color: var(--accent-ink); border-radius: 9px;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; padding: 0 3px;
  }

  /* ---- 하단 드로어 ---- */
  #drawer {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #drawerHead { display: flex; align-items: center; gap: 8px; padding-block: 10px 2px; }
  #drawerTitle { font-size: 13px; font-weight: 700; }
  #drawerMeta { margin-left: auto; font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #cats { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
  #cats::-webkit-scrollbar { display: none; }
  #cats .chip { background: var(--panel-2); backdrop-filter: none; }
  #cats .chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  #cards { display: flex; gap: 10px; overflow-x: auto; padding-block: 4px 14px; scrollbar-width: none; }
  #cards::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; width: 108px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; cursor: pointer; font: inherit; color: var(--fg);
    text-align: left; position: relative;
  }
  .card:active { border-color: var(--fg-dim); }
  .card.installed { border-color: var(--accent); }
  .card img { width: 92px; height: 92px; border-radius: 8px; background: #11151a; display: block; }
  .card .nm { font-size: 12px; line-height: 1.35; margin-top: 6px; min-height: 2.7em; }
  .card .pr { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  .card .badge {
    position: absolute; top: 6px; left: 6px; background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
  }
  #disclaim { font-size: 10.5px; color: var(--fg-dim); padding-bottom: 8px; margin: 0; }

  /* ---- 옵션 시트 ---- */
  #optSheet { padding-block: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  #optHead { display: flex; align-items: center; gap: 10px; }
  #optName { font-size: 14px; font-weight: 700; }
  #optPrice { font-size: 12.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #optSw { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: none; color: var(--fg-dim); font: inherit; font-size: 11px; cursor: pointer;
    padding: 0;
  }
  .sw .dot {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box;
  }
  .sw.on { color: var(--fg); }
  .sw.on .dot { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(111,182,201,.35); }
  #optActions { display: flex; gap: 8px; }
  #optActions button {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--fg); font: inherit; font-size: 13.5px; padding: 11px; cursor: pointer;
  }
  #optActions .done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  /* ---- 목록/스크린샷 모달 ---- */
  .modal {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .sheet {
    width: 100%; max-width: 520px; box-sizing: border-box; background: var(--panel);
    border-radius: 16px 16px 0 0; border: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 10px; max-height: 70%;
  }
  .sheet h2 { font-size: 14px; margin: 0; }
  #cartRows { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .cartRow { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 9px 11px; }
  .cartRow .ri { min-width: 0; }
  .cartRow .rn { font-size: 13px; }
  .cartRow .rv { font-size: 11.5px; color: var(--fg-dim); }
  .cartRow .rp { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cartRow .rx { background: none; border: none; color: var(--fg-dim); font-size: 15px; cursor: pointer; padding: 4px; }
  #cartTotal { display: flex; font-size: 13.5px; font-weight: 700; padding-inline: 2px; }
  #cartTotal span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; }
  .sheet .btnRow { display: flex; gap: 8px; }
  .sheet .btnRow button {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--fg); font: inherit; font-size: 13px; padding: 11px; cursor: pointer;
  }
  .sheet .btnRow .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #shotModal { justify-content: center; gap: 10px; padding: max(16px, env(safe-area-inset-left, 0px)); }
  #shotModal img { max-width: 92%; max-height: 68%; border-radius: 10px; border: 1px solid var(--line); }
  #shotModal p { color: var(--fg-dim); font-size: 12px; margin: 0; }
  .empty { color: var(--fg-dim); font-size: 13px; text-align: center; padding-block: 18px; }
</style>

<div id="app">
  <div id="stage">
    <div id="topbar">
      <button class="chip on" data-view="overview" id="v0">전체</button>
      <button class="chip" data-view="driver">운전석</button>
      <button class="chip" data-view="passenger">조수석</button>
      <button class="chip" data-view="rear">2열</button>
      <button class="chip" id="themeBtn">내장: 블랙</button>
    </div>
    <div id="hint" hidden></div>
    <div id="fab">
      <button id="shotBtn" title="스크린샷" aria-label="스크린샷">📷</button>
      <button id="cartBtn" title="장착 목록" aria-label="장착 목록">🛒<span id="cartCount" hidden>0</span></button>
    </div>
    <div id="fps">-- fps</div>
  </div>

  <div id="drawer">
    <div id="main">
      <div id="drawerHead">
        <span id="drawerTitle">상품을 선택하면 바로 장착됩니다</span>
        <span id="drawerMeta"></span>
      </div>
      <div id="cats"></div>
      <div id="cards"></div>
      <p id="disclaim">상품·가격은 POC용 예시 데이터입니다.</p>
    </div>
    <div id="optSheet" hidden>
      <div id="optHead">
        <span id="optName"></span>
        <span id="optPrice"></span>
      </div>
      <div id="optSw"></div>
      <div id="optActions">
        <button id="optRemove">제거</button>
        <button class="done" id="optDone">완료</button>
      </div>
    </div>
  </div>

  <div id="cartModal" class="modal" hidden>
    <div class="sheet">
      <h2>장착한 상품</h2>
      <div id="cartRows"></div>
      <div id="cartTotal"><span>합계 (예시)</span><span id="cartSum">₩0</span></div>
      <div class="btnRow">
        <button id="clearAll">전체 비우기</button>
        <button class="primary" id="cartClose">닫기</button>
      </div>
    </div>
  </div>

  <div id="shotModal" class="modal" hidden>
    <img id="shotImg" alt="장면 스크린샷">
    <p>이미지를 길게 눌러(또는 우클릭) 저장하세요.</p>
    <button class="chip" id="shotClose">닫기</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
const won = (n) => '₩' + n.toLocaleString('ko-KR');

/* ---------- 렌더러 / 장면 ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181e);
scene.fog = new THREE.Fog(0x14181e, 6, 14);

const camera = new THREE.PerspectiveCamera(58, 1, 0.01, 60);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.12;
orbit.minDistance = 0.25;
orbit.maxDistance = 6;
orbit.maxPolarAngle = Math.PI * 0.55;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xe8eef5, 0x3b4048, 1.0);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e4, 2.2);
sun.position.set(2.5, 4.5, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -2.5; sun.shadow.camera.right = 2.5;
sun.shadow.camera.top = 2.5; sun.shadow.camera.bottom = -2.5;
sun.shadow.bias = -0.0005;
scene.add(sun);

/* 바닥 */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x0e1115, roughness: 0.95 })
);
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

const productsGroup = new THREE.Group();
scene.add(productsGroup);

/* ---------- 절차적 텍스처 / 재질 ---------- */
function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const carbonTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#101013'; g.fillRect(0, 0, s, s);
  const n = 8, k = s / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const gr = g.createLinearGradient(x * k, y * k, (x + 1) * k, (y + 1) * k);
    if ((x + y) % 2 === 0) { gr.addColorStop(0, '#2d2d33'); gr.addColorStop(1, '#0b0b0d'); }
    else { gr.addColorStop(0, '#141417'); gr.addColorStop(1, '#36363e'); }
    g.fillStyle = gr; g.fillRect(x * k, y * k, k - 1, k - 1);
  }
}, 5);
const woodTex = canvasTex(256, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s);
  gr.addColorStop(0, '#7a5635'); gr.addColorStop(0.5, '#6a4a2c'); gr.addColorStop(1, '#7f5b38');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    const y = Math.random() * s;
    g.strokeStyle = `rgba(40,24,12,${0.08 + Math.random() * 0.2})`;
    g.lineWidth = 0.5 + Math.random() * 1.5;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= s; x += 16) g.lineTo(x, y + Math.sin(x * 0.05 + i) * 2.5);
    g.stroke();
  }
}, 1);
function ribTexOf(base, rib) {
  return canvasTex(64, (g, s) => {
    g.fillStyle = base; g.fillRect(0, 0, s, s);
    g.fillStyle = rib;
    for (let y = 0; y < s; y += 8) g.fillRect(0, y, s, 3);
  }, 9);
}
const ribBlack = ribTexOf('#17181b', '#24262b');
const ribBeige = ribTexOf('#8d7f6a', '#9f9179');

const MAT = {
  carbon: () => new THREE.MeshPhysicalMaterial({ map: carbonTex, roughness: 0.32, clearcoat: 1, clearcoatRoughness: 0.12 }),
  wood: () => new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.45 }),
  white: () => new THREE.MeshPhysicalMaterial({ color: 0xf2f2ee, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.08 }),
  black: () => new THREE.MeshStandardMaterial({ color: 0x1c1d21, roughness: 0.85 }),
};

/* ---------- 샘플 실내 (내장: 모델Y 스타일 플레이스홀더, z−: 전방) ---------- */
const themeable = []; // 내장색(블랙/화이트) 전환 대상 재질
function themedMat(blackHex, whiteHex, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ color: blackHex, roughness: 0.7, ...opts });
  m.userData = { blackHex, whiteHex };
  themeable.push(m);
  return m;
}
function buildInterior() {
  const g = new THREE.Group();
  const dash = new THREE.MeshStandardMaterial({ color: 0x24262b, roughness: 0.8 });
  const carpet = new THREE.MeshStandardMaterial({ color: 0x141518, roughness: 0.95 });
  const seat = themedMat(0x2b2d33, 0xd9d5cc);
  const insert = themedMat(0x34363d, 0xcfcbc2);
  const add = (geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
    g.add(m); return m;
  };
  // 바닥 / 대시보드
  add(new THREE.BoxGeometry(1.6, 0.04, 2.7), carpet, 0, -0.02, 0.35);
  add(new RoundedBoxGeometry(1.56, 0.3, 0.42, 3, 0.05), dash, 0, 0.72, -0.95);
  add(new RoundedBoxGeometry(1.56, 0.1, 0.55, 3, 0.04), dash, 0, 0.53, -0.9);
  // 센터 디스플레이 (15.4", 391mm 대각 ≈ 340×194mm 실측)
  const screen = add(new RoundedBoxGeometry(0.34, 0.194, 0.012, 2, 0.006),
    new THREE.MeshPhysicalMaterial({ color: 0x05070c, roughness: 0.08, clearcoat: 1 }), 0, 0.72, -0.72);
  screen.rotation.x = -0.12;
  // 스티어링
  const wheel = add(new THREE.TorusGeometry(0.17, 0.021, 14, 48),
    new THREE.MeshStandardMaterial({ color: 0x17181c, roughness: 0.9 }), -0.38, 0.72, -0.62);
  wheel.rotation.x = -1.25;
  // 센터 콘솔 + 컵홀더 홈
  add(new RoundedBoxGeometry(0.26, 0.2, 0.95, 3, 0.03), dash, 0, 0.33, -0.1);
  const hole = new THREE.MeshStandardMaterial({ color: 0x0c0c0f, roughness: 0.9 });
  for (const dz of [-0.33, -0.22]) add(new THREE.CylinderGeometry(0.038, 0.036, 0.02, 24), hole, 0, 0.43, dz);
  // 앞좌석
  for (const x of [-0.38, 0.38]) {
    add(new RoundedBoxGeometry(0.48, 0.14, 0.52, 3, 0.05), seat, x, 0.42, 0.28);
    add(new RoundedBoxGeometry(0.48, 0.62, 0.13, 3, 0.05), seat, x, 0.78, 0.55).rotation.x = 0.17;
    add(new RoundedBoxGeometry(0.24, 0.16, 0.09, 3, 0.03), seat, x, 1.17, 0.62);
  }
  // 2열
  add(new RoundedBoxGeometry(1.35, 0.15, 0.5, 3, 0.05), seat, 0, 0.4, 1.35);
  add(new RoundedBoxGeometry(1.35, 0.6, 0.14, 3, 0.05), seat, 0, 0.76, 1.63).rotation.x = 0.2;
  // 도어 패널 + 인서트 + 암레스트
  for (const x of [-0.8, 0.8]) {
    add(new RoundedBoxGeometry(0.06, 0.62, 1.15, 3, 0.02), dash, x, 0.5, -0.2);
    add(new RoundedBoxGeometry(0.05, 0.22, 1.0, 3, 0.02), insert, x * 0.99, 0.64, -0.2);
    add(new RoundedBoxGeometry(0.09, 0.05, 0.6, 3, 0.02), dash, x * 0.93, 0.56, -0.15);
    add(new RoundedBoxGeometry(0.06, 0.55, 1.0, 3, 0.02), dash, x, 0.48, 1.15);
  }
  // 글라스 루프
  const glass = add(new RoundedBoxGeometry(1.5, 0.02, 2.4, 2, 0.01),
    new THREE.MeshPhysicalMaterial({ color: 0x0a0e14, roughness: 0.1, transparent: true, opacity: 0.85 }), 0, 1.42, 0.3);
  glass.castShadow = false;
  return g;
}
scene.add(buildInterior());
applyTheme('black');

function applyTheme(t) {
  for (const m of themeable) m.color.set(t === 'white' ? m.userData.whiteHex : m.userData.blackHex);
}
let theme = 'black';
$('themeBtn').addEventListener('click', () => {
  theme = theme === 'black' ? 'white' : 'black';
  applyTheme(theme);
  $('themeBtn').textContent = '내장: ' + (theme === 'black' ? '블랙' : '화이트');
  persist();
});

/* ---------- 상품 카탈로그 (전부 절차 생성 3D, 고정 장착 위치) ---------- */
const glowMats = [];
function glowMat(hex) {
  const m = new THREE.MeshStandardMaterial({ color: 0x070707, emissive: hex, emissiveIntensity: 3.2 });
  glowMats.push(m);
  return m;
}
const SW = { // 스와치 표현
  carbon: 'repeating-linear-gradient(45deg,#2c2c33 0 4px,#0c0c0e 4px 8px)',
  wood: 'linear-gradient(180deg,#7a5635,#6a4a2c)',
  white: '#eceae4', black: '#232529', beige: '#8d7f6a',
};
const trimVariants = [
  { id: 'carbon', label: '카본', sw: SW.carbon },
  { id: 'wood', label: '우드', sw: SW.wood },
  { id: 'white', label: '화이트', sw: SW.white },
];
const lightVariants = [
  { id: '#7fd4ff', label: '아이스블루', sw: '#7fd4ff' },
  { id: '#fff3e0', label: '웜화이트', sw: '#fff3e0' },
  { id: '#b388ff', label: '퍼플', sw: '#b388ff' },

  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(h, d) * 0.3), mat);
  m.position.set(x, y, z); m.rotation.x = rx; m.castShadow = true;
  return m;
}

const byId = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));

/* ---------- 장착 상태 ---------- */
const installed = new Map(); // id -> { root, variant }

function install(p, variantId, fly = true) {
  remove(p.id, false);
  const root = p.build(variantId);
  root.userData = { productId: p.id };
  productsGroup.add(root);
  installed.set(p.id, { root, variant: variantId });
  refreshCards(); refreshCart(); persist();
  if (fly) flyTo(p.focus);
}
function remove(id, refresh = true) {
  const e = installed.get(id);
  if (!e) return;
  productsGroup.remove(e.root);
  installed.delete(id);
  if (refresh) { refreshCards(); refreshCart(); persist(); }
}
function totalPrice() {
  let t = 0;
  for (const id of installed.keys()) t += byId[id].price;
  return t;
}

/* ---------- 카메라 이동 ---------- */
let flyAnim = null;
function flyTo(f) {
  flyAnim = {
    t: 0,
    p0: camera.position.clone(), p1: new THREE.Vector3(...f.pos),
    t0: orbit.target.clone(), t1: new THREE.Vector3(...f.tgt),
  };
}
const VIEWS = {
  overview: { pos: [1.55, 1.45, 1.75], tgt: [0, 0.5, -0.1] },
  driver: { pos: [-0.38, 1.0, 0.45], tgt: [0.12, 0.62, -0.85] },

};
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('on', x === b));
  flyTo(VIEWS[b.dataset.view]);
}));
camera.position.set(...VIEWS.overview.pos);
orbit.target.set(...VIEWS.overview.tgt);

/* ---------- 상품 썸네일 (절차 생성 모델을 미니 렌더) ---------- */
const thumbs = {};
function makeThumbs() {
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setSize(128, 128);
  r.toneMapping = THREE.ACESFilmicToneMapping;
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x11151a);
  sc.environment = scene.environment;
  sc.add(new THREE.HemisphereLight(0xffffff, 0x445, 1.2));
  const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 3, 2); sc.add(d);
  const cam = new THREE.PerspectiveCamera(40, 1, 0.01, 10);
  for (const p of PRODUCTS) {
    const obj = p.build(p.def);
    const box = new THREE.Box3().setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length() || 0.3;
    obj.position.sub(c);
    sc.add(obj);
    cam.position.set(size * 0.8, size * 0.7, size * 1.1);
    cam.lookAt(0, 0, 0);
    r.render(sc, cam);
    thumbs[p.id] = r.domElement.toDataURL('image/png');
    sc.remove(obj);
  }
  r.dispose();
}
makeThumbs();

/* ---------- 드로어 UI ---------- */
let activeCat = 'all';
const catsEl = $('cats');
for (const c of CATEGORIES) {
  const b = document.createElement('button');
  b.className = 'chip' + (c.id === 'all' ? ' on' : '');
  b.textContent = c.label; b.id = 'cat_' + c.id;

    catsEl.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b));

function refreshCards() {
  const el = $('cards');
  el.textContent = '';
  for (const p of PRODUCTS) {
    if (activeCat !== 'all' && p.cat !== activeCat) continue;
    const inst = installed.get(p.id);
    const b = document.createElement('button');
    b.className = 'card' + (inst ? ' installed' : '');
    b.id = 'card_' + p.id;
    const img = document.createElement('img');
    img.src = thumbs[p.id]; img.alt = p.name;
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = p.name;
    const pr = document.createElement('div'); pr.className = 'pr'; pr.textContent = won(p.price);
    b.append(img, nm, pr);
    if (inst) {
      const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = '장착됨';
      b.appendChild(bd);
    }
    b.addEventListener('click', () => {
      if (installed.has(p.id)) { flyTo(p.focus); openOptions(p); }
      else { install(p, p.def); openOptions(p); showHint(`${p.name} 장착 완료`, 1800); }
    });
    el.appendChild(b);
  }
  const n = installed.size;
  $('drawerMeta').textContent = n ? `장착 ${n} · ${won(totalPrice())}` : '';
  $('cartCount').hidden = n === 0;
  $('cartCount').textContent = n;
}

/* ---------- 옵션 시트 ---------- */
let optProduct = null;
function openOptions(p) {
  optProduct = p;
  $('optName').textContent = p.name;
  $('optPrice').textContent = won(p.price) + ' · 예시';
  const sw = $('optSw');
  sw.textContent = '';
  const cur = installed.get(p.id)?.variant ?? p.def;
  for (const v of p.variants) {
    const b = document.createElement('button');
    b.className = 'sw' + (v.id === cur ? ' on' : '');
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = v.sw;
    const lb = document.createElement('span'); lb.textContent = v.label;
    b.append(dot, lb);
    b.addEventListener('click', () => {
      install(p, v.id, false);
      sw.querySelectorAll('.sw').forEach((x) => x.classList.toggle('on', x === b));
    });
    sw.appendChild(b);
  }
  $('main').hidden = true;
  $('optSheet').hidden = false;
}
function closeOptions() {
  optProduct = null;
  $('optSheet').hidden = true;
  $('main').hidden = false;
}
$('optDone').addEventListener('click', closeOptions);
$('optRemove').addEventListener('click', () => {
  if (optProduct) remove(optProduct.id);
  closeOptions();
});

/* ---------- 3D에서 상품 탭 → 옵션 ---------- */
const raycaster = new THREE.Raycaster();
let downPos = null, downTime = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const dt = performance.now() - downTime;
  downPos = null;
  if (moved > 8 || dt > 600) return;
  const rect = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  ), camera);
  const hits = raycaster.intersectObjects(productsGroup.children, true);
  if (hits.length) {
    let o = hits[0].object;
    while (o && !o.userData?.productId) o = o.parent;
    if (o) { const p = byId[o.userData.productId]; flyTo(p.focus); openOptions(p); }
  }
});

  for (const [id, e] of installed) {

    const row = document.createElement('div'); row.className = 'cartRow';
    const img = document.createElement('img');
    img.src = thumbs[id]; img.alt = ''; img.style.cssText = 'width:40px;height:40px;border-radius:8px';
    const ri = document.createElement('div'); ri.className = 'ri';

    const rv = document.createElement('div'); rv.className = 'rv';

    const rp = document.createElement('div'); rp.className = 'rp'; rp.textContent = won(p.price);
    const rx = document.createElement('button'); rx.className = 'rx'; rx.textContent = '✕';

    rx.addEventListener('click', () => { remove(id); refreshCart(); });
    row.append(img, ri, rp, rx);
    el.appendChild(row);
  }

}

/* ---------- 스크린샷 ---------- */
$('shotBtn').addEventListener('click', () => {

});

/* ---------- 저장 (이 브라우저에 자동 저장) ---------- */
function persist() {
  try {
    localStorage.setItem('carpoc.v2', JSON.stringify({
      theme, items: [...installed.entries()].map(([id, e]) => ({ id, v: e.variant })),
    }));
  } catch { /* 사용 불가 환경 무시 */ }
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem('carpoc.v2'));
    if (!d) return;
    if (d.theme === 'white') { theme = 'white'; applyTheme('white'); $('themeBtn').textContent = '내장: 화이트'; }
    for (const it of d.items || []) {
      const p = byId[it.id];
      if (p) install(p, p.variants.some((v) => v.id === it.v) ? it.v : p.def, false);
    }
  } catch { /* 저장 데이터 없음/손상 무시 */ }
}
restore();
refreshCards();

/* ---------- 힌트 ---------- */
let hintTimer = 0;
function showHint(text, ms) {
  const h = $('hint');
  h.textContent = text; h.hidden = false;
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(() => { h.hidden = true; }, ms);
}
if (!installed.size) showHint('아래에서 상품을 고르면 바로 장착됩니다', 5000);

/* ---------- 루프 / 리사이즈 / FPS ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let frames = 0, fpsT = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (flyAnim) {
    flyAnim.t = Math.min(1, flyAnim.t + 1 / 40);
    const k = 1 - Math.pow(1 - flyAnim.t, 3); // easeOutCubic
    camera.position.lerpVectors(flyAnim.p0, flyAnim.p1, k);
    orbit.target.lerpVectors(flyAnim.t0, flyAnim.t1, k);
    if (flyAnim.t >= 1) flyAnim = null;
  }
  orbit.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - fpsT >= 1000) {
    $('fps').textContent = Math.round(frames * 1000 / (now - fpsT)) + ' fps';
    frames = 0; fpsT = now;
  }
}
loop();
