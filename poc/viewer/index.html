<title>실내 장착 미리보기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 레이아웃: 차량 선택 → 전체 화면 3D(외관/내관) + 하단 상품 드로어, 단일 다크 테마 뷰어 */
  :root {
    --bg: #101317;
    --panel: #181d23;
    --panel-2: #222932;
    --line: #2d3540;
    --fg: #e9edf3;
    --fg-dim: #9aa6b3;
    --accent: #6fb6c9;
    --accent-ink: #0b1316;
    --pop: #d9a05b;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 14px;
  }
  #app { position: relative; height: 100%; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage canvas { display: block; touch-action: none; }

  .chip {
    background: rgba(16,19,23,.85); border: 1px solid var(--line); color: var(--fg);
    border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font: inherit;
    backdrop-filter: blur(4px); cursor: pointer; white-space: nowrap;
  }
  button.chip:active { background: var(--line); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #topbar {
    position: absolute; top: 10px; left: 0; right: 0; z-index: 5;
    display: flex; gap: 6px; align-items: center; overflow-x: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    scrollbar-width: none;
  }
  #topbar::-webkit-scrollbar { display: none; }
  #modeSeg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: 0 0 auto; }
  #modeSeg button {
    border: none; background: rgba(16,19,23,.85); color: var(--fg-dim); font: inherit;
    font-size: 12.5px; padding: 7px 14px; cursor: pointer;
  }
  #modeSeg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .chipSet { display: flex; gap: 6px; }

  #fps {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 8px; z-index: 4;
    font-size: 10px; color: var(--fg-dim); font-variant-numeric: tabular-nums;
    background: rgba(16,19,23,.6); padding: 2px 6px; border-radius: 6px; pointer-events: none;
  }
  #hint {
    position: absolute; left: 50%; transform: translateX(-50%); top: 56px; z-index: 5;
    pointer-events: none; background: rgba(111,182,201,.15); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 10px; padding: 7px 14px; font-size: 12.5px;
    max-width: 86%; text-align: center;
  }
  #fab {
    position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5;
    display: flex; flex-direction: column; gap: 8px; bottom: 16px;
  }
  #fab button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(16,19,23,.88); color: var(--fg); font-size: 17px; cursor: pointer;
    backdrop-filter: blur(4px); position: relative;
  }
  #fab button:active { background: var(--line); }
  #cartCount {
    position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
    background: var(--accent); color: var(--accent-ink); border-radius: 9px;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; padding: 0 3px;
  }

  /* ---- 하단 드로어 ---- */
  #drawer {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; margin-top: -16px; position: relative; z-index: 6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #drawerHead { display: flex; align-items: center; gap: 8px; padding-block: 10px 2px; }
  #drawerTitle { font-size: 12.5px; color: var(--fg-dim); }
  #drawerMeta { margin-left: auto; font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #cats { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
  #cats::-webkit-scrollbar { display: none; }
  #cats .chip { background: var(--panel-2); backdrop-filter: none; }
  #cats .chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  #cards { display: flex; gap: 10px; overflow-x: auto; padding-block: 4px 14px; scrollbar-width: none; }
  #cards::-webkit-scrollbar { display: none; }
  .card {
    flex: 0 0 auto; width: 108px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; cursor: pointer; font: inherit; color: var(--fg);
    text-align: left; position: relative;
  }
  .card:active { border-color: var(--fg-dim); }
  .card.installed { border-color: var(--accent); }
  .card img { width: 92px; height: 92px; border-radius: 8px; background: #11151a; display: block; }
  .card .nm { font-size: 12px; line-height: 1.35; margin-top: 6px; min-height: 2.7em; }
  .card .pr { font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  .card .badge {
    position: absolute; top: 6px; left: 6px; background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
  }
  .pop-tag {
    display: inline-block; background: rgba(217,160,91,.18); color: var(--pop);
    border-radius: 5px; font-size: 10px; font-weight: 700; padding: 1px 5px; margin-right: 4px;
    vertical-align: 1px;
  }
  #disclaim { font-size: 10.5px; color: var(--fg-dim); padding-bottom: 8px; margin: 0; }

  /* ---- 옵션 시트 ---- */
  #optSheet { padding-block: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  #optHead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #optName { font-size: 14px; font-weight: 700; }
  #optPrice { font-size: 12.5px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  #optFit { font-size: 11px; color: var(--fg-dim); }
  #optSw { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    background: none; border: none; color: var(--fg-dim); font: inherit; font-size: 11px; cursor: pointer;
    padding: 0;
  }
  .sw .dot { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
  .sw.on { color: var(--fg); }
  .sw.on .dot { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(111,182,201,.35); }
  #optActions { display: flex; gap: 8px; }
  #optActions button {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--fg); font: inherit; font-size: 13.5px; padding: 11px; cursor: pointer;
  }
  #optActions .done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  /* ---- 모달 공통 ---- */
  .modal {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .sheet {
    width: 100%; max-width: 520px; box-sizing: border-box; background: var(--panel);
    border-radius: 16px 16px 0 0; border: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 10px; max-height: 70%;
  }
  .sheet h2 { font-size: 14px; margin: 0; }
  #cartRows { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .cartRow { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 9px 11px; }
  .cartRow .ri { min-width: 0; }
  .cartRow .rn { font-size: 13px; }
  .cartRow .rv { font-size: 11.5px; color: var(--fg-dim); }
  .cartRow .rp { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .cartRow .rx { background: none; border: none; color: var(--fg-dim); font-size: 15px; cursor: pointer; padding: 4px; }
  #cartTotal { display: flex; font-size: 13.5px; font-weight: 700; padding-inline: 2px; }
  #cartTotal span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; }
  .btnRow { display: flex; gap: 8px; }
  .btnRow button {
    flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--fg); font: inherit; font-size: 13px; padding: 11px; cursor: pointer;
  }
  .btnRow .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #shotModal { justify-content: center; gap: 10px; padding: max(16px, env(safe-area-inset-left, 0px)); }
  #shotModal img { max-width: 92%; max-height: 68%; border-radius: 10px; border: 1px solid var(--line); }
  #shotModal p { color: var(--fg-dim); font-size: 12px; margin: 0; }
  .empty { color: var(--fg-dim); font-size: 13px; text-align: center; padding-block: 18px; }

  /* ---- 차량 선택 ---- */
  #carSelect {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #carSelect h1 { font-size: 19px; margin: 0; }
  #carSelect .sub { color: var(--fg-dim); font-size: 13px; margin: -8px 0 0; }
  #carList { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 560px; }
  .carCard {
    width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; cursor: pointer; font: inherit; color: var(--fg); text-align: left;
  }
  .carCard:active { border-color: var(--accent); }
  .carCard img { width: 130px; height: 86px; object-fit: cover; border-radius: 9px; background: #11151a; display: block; }
  .carCard .cn { font-size: 13.5px; font-weight: 700; margin-top: 8px; }
  .carCard .cy { font-size: 11.5px; color: var(--fg-dim); }
  #carNote { font-size: 10.5px; color: var(--fg-dim); max-width: 480px; text-align: center; line-height: 1.6; margin: 0; }
</style>

<div id="app">
  <div id="stage">
    <div id="topbar">
      <button class="chip" id="carChange">차량 변경</button>
      <div id="modeSeg">
        <button id="modeExt" class="on">외관</button>
        <button id="modeInt">내관</button>
      </div>
      <span class="chipSet" id="extChips">
        <button class="chip on" data-eview="overview">전체</button>
        <button class="chip" data-eview="front">전면</button>
        <button class="chip" data-eview="rear">후면</button>
        <button class="chip" data-eview="side">측면</button>
        <button class="chip" id="paintBtn">차량 색상</button>
      </span>
      <span class="chipSet" id="intChips" hidden>
        <button class="chip on" data-iview="overview">전체</button>
        <button class="chip" data-iview="driver">운전석</button>
        <button class="chip" data-iview="passenger">조수석</button>
        <button class="chip" data-iview="rear">2열</button>
        <button class="chip" id="themeBtn">내장: 블랙</button>
      </span>

    <div id="hint" hidden></div>
    <div id="fab">
      <button id="shotBtn" title="스크린샷" aria-label="스크린샷">📷</button>
      <button id="cartBtn" title="장착 목록" aria-label="장착 목록">🛒<span id="cartCount" hidden>0</span></button>

  </div>

  <div id="drawer">
    <div id="main">
      <div id="drawerHead">
        <span id="drawerTitle"></span>

      </div>

      <div id="cards"></div>
      <p id="disclaim">상품·가격은 POC용 예시 데이터이며, 호환 표시는 데모입니다.</p>
    </div>
    <div id="optSheet" hidden>
      <div id="optHead">
        <span id="optName"></span>
        <span id="optPrice"></span>
        <span id="optFit"></span>
      </div>
      <div id="optSw"></div>
      <div id="optActions">
        <button id="optRemove">제거</button>
        <button class="done" id="optDone">완료</button>
      </div>
    </div>
  </div>

  <div id="cartModal" class="modal" hidden>
    <div class="sheet">
      <h2 id="cartTitle">장착한 상품</h2>
      <div id="cartRows"></div>
      <div id="cartTotal"><span>합계 (예시)</span><span id="cartSum">₩0</span></div>
      <div class="btnRow">
        <button id="copyList">목록 복사</button>
        <button id="clearAll">전체 비우기</button>
        <button class="primary" id="cartClose">닫기</button>
      </div>
    </div>
  </div>

  <div id="shotModal" class="modal" hidden>
    <img id="shotImg" alt="장면 스크린샷">
    <p>이미지를 길게 눌러(또는 우클릭) 저장하세요.</p>

  <div id="carSelect" hidden>
    <h1>어떤 차를 꾸밀까요?</h1>
    <p class="sub">차종을 선택하면 호환 상품만 보여드립니다</p>
    <div id="carList"></div>
    <p id="carNote">차량명은 호환 대상 표기이며 제조사와 무관한 독립 시뮬레이터입니다.<br>차량 형상은 근사 모델(플레이스홀더)입니다.</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const $ = (id) => document.getElementById(id);
const won = (n) => '₩' + n.toLocaleString('ko-KR');

/* ---------- 렌더러 / 장면 ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f13);
scene.fog = new THREE.Fog(0x0c0f13, 12, 26);

const camera = new THREE.PerspectiveCamera(50, 1, 0.01, 80);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = 0.12;
orbit.maxPolarAngle = Math.PI * 0.55;

/* ---------- 스튜디오 환경맵 (자동차 촬영용 소프트박스 배치) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
function makeStudioEnv() {
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x030405);
  const panel = (w, h, c, px, py, pz, lx = 0, ly = 0, lz = 0) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })
    );
    m.position.set(px, py, pz);
    m.lookAt(lx, ly, lz);
    sc.add(m);
  };
  // 머리 위 긴 소프트박스 (차체에 긴 하이라이트 스트릭)
  panel(10, 2.4, new THREE.Color(9, 9, 10), 0, 6, 0);
  // 좌우 측면 소프트박스
  panel(2.2, 5, new THREE.Color(2.4, 2.5, 2.8), -7, 2.2, 0);
  panel(2.2, 5, new THREE.Color(2.4, 2.5, 2.8), 7, 2.2, 0);
  // 전/후 낮은 필
  panel(5, 1.6, new THREE.Color(1.1, 1.15, 1.3), 0, 1.2, -8);
  panel(5, 1.6, new THREE.Color(0.9, 0.95, 1.05), 0, 1.2, 8);
  // 바닥 바운스
  panel(12, 12, new THREE.Color(0.25, 0.26, 0.3), 0, -0.2, 0, 0, 5, 0);
  return pmrem.fromScene(sc, 0.03).texture;
}
scene.environment = makeStudioEnv();

const hemi = new THREE.HemisphereLight(0xdfe7f0, 0x2c3138, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(3.2, 6.0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 6;
scene.add(sun);

/* ---------- 스튜디오 바닥 (반사) + 배경 사이클로라마 ---------- */
const floorRefl = new Reflector(new THREE.CircleGeometry(8, 64), {
  textureWidth: 768, textureHeight: 768, color: 0x7d838c,
});
floorRefl.rotation.x = -Math.PI / 2;
floorRefl.position.y = -0.052;
scene.add(floorRefl);

const floorFade = canvasTexOnce(256, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, s * 0.1, s / 2, s / 2, s * 0.5);
  gr.addColorStop(0, 'rgba(10,12,15,0.62)');
  gr.addColorStop(0.7, 'rgba(10,12,15,0.86)');
  gr.addColorStop(1, 'rgba(10,12,15,1)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const floorMatte = new THREE.Mesh(
  new THREE.CircleGeometry(8.01, 64),
  new THREE.MeshBasicMaterial({ map: floorFade, transparent: true, depthWrite: false })
);
floorMatte.rotation.x = -Math.PI / 2;
floorMatte.position.y = -0.049;
scene.add(floorMatte);

const shadowFloor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 48),
  new THREE.ShadowMaterial({ opacity: 0.5 })
);
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = -0.048;
shadowFloor.receiveShadow = true;
scene.add(shadowFloor);

const cyc = new THREE.Mesh(
  new THREE.CylinderGeometry(13, 13, 9, 64, 1, true),
  new THREE.MeshBasicMaterial({
    map: canvasTexOnce(64, (g, s) => {
      const gr = g.createLinearGradient(0, 0, 0, s);
      gr.addColorStop(0, '#0a0d11'); gr.addColorStop(0.75, '#161b22'); gr.addColorStop(1, '#1b212a');
      g.fillStyle = gr; g.fillRect(0, 0, s, s);
    }),
    side: THREE.BackSide, fog: false,
  })
);
cyc.position.y = 4.4;
scene.add(cyc);

function canvasTexOnce(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const exteriorGroup = new THREE.Group();
const interiorGroup = new THREE.Group();
const productsGroup = new THREE.Group();
scene.add(exteriorGroup, interiorGroup, productsGroup);

function disposeGroup(g) {
  g.traverse((o) => { o.geometry?.dispose?.(); });
  g.clear();
}

/* ---------- 반복 텍스처 ---------- */
function canvasTex(size, draw, repeat = 1) {
  const t = canvasTexOnce(size, draw);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  return t;
}
const carbonTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#101013'; g.fillRect(0, 0, s, s);
  const n = 8, k = s / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const gr = g.createLinearGradient(x * k, y * k, (x + 1) * k, (y + 1) * k);
    if ((x + y) % 2 === 0) { gr.addColorStop(0, '#2d2d33'); gr.addColorStop(1, '#0b0b0d'); }
    else { gr.addColorStop(0, '#141417'); gr.addColorStop(1, '#36363e'); }
    g.fillStyle = gr; g.fillRect(x * k, y * k, k - 1, k - 1);
  }
}, 5);
const woodTex = canvasTex(256, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s);
  gr.addColorStop(0, '#7a5635'); gr.addColorStop(0.5, '#6a4a2c'); gr.addColorStop(1, '#7f5b38');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    const y = Math.random() * s;

/* ---------- 차체: 단면 로프트 헐 ----------
   측면 실루엣(톱·벨트·하부 곡선)을 1D 커브로 두고, z마다 좌우 대칭 단면 링을 생성해
   그물(grid)로 잇는다. 면의 중심 y·z로 페인트/글라스/클래딩 재질 그룹을 나눈다. */
function curve1D(ctrl) {
  // ctrl: [[z,y]...] 오름차순. Catmull-Rom 보간 함수 반환
  return (z) => {
    const n = ctrl.length;
    if (z <= ctrl[0][0]) return ctrl[0][1];
    if (z >= ctrl[n - 1][0]) return ctrl[n - 1][1];
    let i = 0;
    while (i < n - 2 && z > ctrl[i + 1][0]) i++;
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(n - 1, i + 2)];
    const t = (z - p1[0]) / (p2[0] - p1[0]);
    const t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t +
      (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
      (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
  };
}
function hullGeometry(cfg) {
  const { z0, z1, nSt, half, section, groupOf } = cfg;
  const SM = 15; // 반단면 샘플 수
  const rings = [];
  const zs = [];
  for (let i = 0; i < nSt; i++) {
    const u = i / (nSt - 1);
    const z = z0 + (z1 - z0) * u;
    zs.push(z);
    // 반단면 제어점 → Catmull 샘플 → 미러
    const pts = section(z, u);
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], 0)), false, 'centripetal');
    const samp = curve.getPoints(SM);
    const ring = [];
    for (const p of samp) ring.push([Math.max(0, p.x), p.y]);
    for (let k = samp.length - 2; k >= 1; k--) ring.push([-Math.max(0, samp[k].x), samp[k].y]);
    rings.push(ring);
  }
  const M = rings[0].length;
  const pos = [];
  for (let i = 0; i < nSt; i++) for (const p of rings[i]) pos.push(p[0], p[1], zs[i]);
  const buckets = [[], [], []];
  const vy = (idx) => pos[idx * 3 + 1];
  const vz = (idx) => pos[idx * 3 + 2];
  for (let i = 0; i < nSt - 1; i++) for (let j = 0; j < M; j++) {
    const j2 = (j + 1) % M;
    const a = i * M + j, b = i * M + j2, c = (i + 1) * M + j, d = (i + 1) * M + j2;
    const g = groupOf((vy(a) + vy(b) + vy(c) + vy(d)) / 4, (vz(a) + vz(c)) / 2);
    buckets[g].push(a, b, d, a, d, c);
  }
  // 캡 (전/후)
  const capFan = (ringIdx, front) => {
    const base = ringIdx * M;
    let cx = 0, cy = 0;
    for (let j = 0; j < M; j++) { cy += vy(base + j); }
    cy /= M;
    const ci = pos.length / 3;
    pos.push(0, cy, zs[ringIdx]);
    const g = groupOf(cy, zs[ringIdx]);
    for (let j = 0; j < M; j++) {
      const a = base + j, b = base + (j + 1) % M;
      if (front) buckets[g].push(ci, b, a);
      else buckets[g].push(ci, a, b);
    }

  capFan(0, true);
  capFan(nSt - 1, false);

  buckets.forEach((arr, g) => {
    geo.addGroup(off, arr.length, g);
    index.push(...arr);
    off += arr.length;
  });
  geo.setIndex(index);
  geo.computeVertexNormals();

}
function carHull(car) {

    ? [[-2.32, 0.6], [-1.9, 0.76], [-1.0, 0.9], [-0.8, 0.97], [-0.3, 1.4], [0.2, 1.62], [0.9, 1.6], [1.6, 1.42], [2.1, 1.18], [2.42, 1.0]]
    : [[-2.3, 0.55], [-1.8, 0.68], [-0.9, 0.84], [-0.72, 0.9], [-0.2, 1.3], [0.3, 1.46], [1.0, 1.43], [1.6, 1.2], [2.0, 0.97], [2.42, 0.9]]);
  const belt = curve1D(suv
    ? [[-2.32, 0.58], [-1.5, 0.88], [-0.8, 0.95], [0.5, 0.99], [1.6, 1.03], [2.42, 0.97]]
    : [[-2.3, 0.54], [-1.4, 0.8], [-0.72, 0.87], [0.5, 0.92], [1.7, 0.95], [2.42, 0.87]]);
  const archC = [-1.35, 1.55], archR = 0.47, hubY = 0.31;
  const bottom = (z) => {
    let b = 0.16;
    for (const c of archC) {
      const dz = z - c;
      if (Math.abs(dz) < archR) b = Math.max(b, hubY + Math.sqrt(archR * archR - dz * dz) * 0.92);
    }
    return b;
  };
  const taper = (u) => Math.max(0.05, Math.pow(1 - Math.pow(Math.abs(2 * u - 1), 5.2), 0.62));
  const zG0 = -0.8, zG1 = suv ? 2.3 : 1.82;
  const section = (z, u) => {
    const f = taper(u);
    const yT = top(z), yBot = bottom(z);
    let yBelt = Math.min(belt(z), yT - 0.03);
    const flare = (Math.abs(z - archC[0]) < 0.6 || Math.abs(z - archC[1]) < 0.6) ? 0.015 : 0;
    const wBody = (W - 0.02 + flare) * f;
    const wRock = (W - 0.07) * f;
    const wBelt = (W - 0.1) * f;
    const wGlass = (W - 0.17) * f;
    const wRoof = (W - 0.42) * f;
    const yShoulder = Math.max(yBot + 0.12, yBelt - 0.24);
    // y 단조 증가 보정
    const pts = [
      [0, yBot],
      [wRock * 0.85, yBot + 0.015],
      [wRock, Math.max(yBot + 0.09, 0.3) ],
      [wBody, yShoulder],
      [wBelt, yBelt],
      [wGlass, yBelt + 0.06],
      [wRoof, yT - 0.05],
      [0, yT + 0.015],

    let prev = -1;
    for (const p of pts) { if (p[1] <= prev) p[1] = prev + 0.004; prev = p[1]; }
    return pts;
  };
  const groupOf = (y, z) => {
    if (z > zG0 && z < zG1 && y > belt(z) + 0.045) return 1;           // 글라스
    if (y < bottom(z) + (suv ? 0.1 : 0.06)) return 2;                  // 클래딩(록커·아치)
    if (z < -2.02 && y < 0.56) return 2;                               // 프런트 범퍼 하부
    if (z > 2.14 && y < (suv ? 0.5 : 0.46)) return 2;                  // 리어 디퓨저
    return 0;                                                          // 페인트
  };

}

  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.toneMapping = THREE.ACESFilmicToneMapping;
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x11151a);

  const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 3, 2); sc.add(d);
  const shoot = (obj, cam, w, h) => {
    r.setSize(w, h);
    sc.add(obj); r.render(sc, cam); sc.remove(obj);
    return r.domElement.toDataURL('image/png');
  };
  const cam = new THREE.PerspectiveCamera(40, 1, 0.01, 40);
  const thumbCar = CARS[0];
  for (const p of PRODUCTS) {
    const obj = p.thumbBuild ? p.thumbBuild() : p.build(p.def, thumbCar);
    const box = new THREE.Box3().setFromObject(obj);
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length() || 0.3;
    obj.position.sub(c);
    cam.position.set(size * 0.8, size * 0.7, size * 1.1);
    cam.lookAt(0, 0, 0);
    cam.aspect = 1; cam.updateProjectionMatrix();
    thumbs[p.id] = shoot(obj, cam, 128, 128);
  }
  const carCam = new THREE.PerspectiveCamera(32, 300 / 172, 0.01, 60);
  for (const c of CARS) {
    const obj = buildExterior(c, c.defPaint);
    carCam.position.set(5.2, 1.9, -5.4);
    carCam.lookAt(0, 0.55, 0);
    carCam.updateProjectionMatrix();
    carThumbs[c.id] = shoot(obj, carCam, 300, 172);
    disposeGroup(obj);
  }
  r.dispose();
}

/* ---------- 3D 탭 → 상품 옵션 ---------- */
const raycaster = new THREE.Raycaster();
let downPos = null, downTime = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downPos = { x: e.clientX, y: e.clientY }; downTime = performance.now();
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
  const dt = performance.now() - downTime;
  downPos = null;
  if (moved > 8 || dt > 600) return;
  const rect = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  ), camera);
  const hits = raycaster.intersectObjects(productsGroup.children, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData?.productId) o = o.parent;
    if (o && o.visible) {
      const p = byId[o.userData.productId];
      flyTo(p.focus); openOptions(p);
      return;
    }
  }
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let frames = 0, fpsT = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (flyAnim) {
    flyAnim.t = Math.min(1, flyAnim.t + 1 / 40);
    const k = 1 - Math.pow(1 - flyAnim.t, 3);
    camera.position.lerpVectors(flyAnim.p0, flyAnim.p1, k);
    orbit.target.lerpVectors(flyAnim.t0, flyAnim.t1, k);
    if (flyAnim.t >= 1) flyAnim = null;
  }
  orbit.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - fpsT >= 1000) {
    $('fps').textContent = Math.round(frames * 1000 / (now - fpsT)) + ' fps';
    frames = 0; fpsT = now;
  }
}
loop();
</script>
